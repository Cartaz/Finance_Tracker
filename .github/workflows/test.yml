name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libdbus-1-3 \
            libnss3

      - name: Install from external working directory
        run: |
          chmod +x "$GITHUB_WORKSPACE/install.sh"
          cd /tmp
          "$GITHUB_WORKSPACE/install.sh"

      - name: Compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests

      - name: Test
        run: .venv/bin/python -m pytest

      - name: Lint
        run: .venv/bin/ruff check main.py config core ui tests

  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libx11-xcb1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libdbus-1-3 \
            libnss3

      - name: Install from external working directory
        run: |
          chmod +x "$GITHUB_WORKSPACE/install.sh"
          cd /tmp
          "$GITHUB_WORKSPACE/install.sh"

      - name: Compile/import smoke
        run: |
          .venv/bin/python -m compileall -q main.py config core ui tests
          .venv/bin/python - <<'PY'
          import sqlite3
          import PySide6
          from PySide6.QtWebChannel import QWebChannel
          from PySide6.QtWebEngineWidgets import QWebEngineView
          from core.database import Database
          from ui.bridge import Bridge

          print(PySide6.__version__, sqlite3.sqlite_version, QWebEngineView.__name__, QWebChannel.__name__, Database.__name__, Bridge.__name__)
          PY
