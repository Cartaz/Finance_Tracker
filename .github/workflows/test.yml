name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libnss3

      - name: Install from external working directory
        run: |
          chmod +x "$GITHUB_WORKSPACE/install.sh"
          cd /tmp
          "$GITHUB_WORKSPACE/install.sh"

      - name: Compile
        run: .venv/bin/python -m compileall -q main.py config core ui tests

      - name: QML lint
        run: .venv/bin/pyside6-qmllint ui/qml/Theme.qml ui/qml/Preview.qml

      - name: QML engine smoke
        run: .venv/bin/python -m pytest -q tests/test_qml_preview.py

      - name: Test
        run: .venv/bin/python -m pytest

      - name: Lint
        run: .venv/bin/ruff check main.py config core ui tests

  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libx11-xcb1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libnss3

      - name: Install from external working directory
        run: |
          chmod +x "$GITHUB_WORKSPACE/install.sh"
          cd /tmp
          "$GITHUB_WORKSPACE/install.sh"

      - name: Compile/import smoke
        run: |
          .venv/bin/python -m compileall -q main.py config core ui tests
          .venv/bin/python - <<'PY'
          import sqlite3
          import PySide6
          from PySide6.QtWebChannel import QWebChannel
          from PySide6.QtWebEngineWidgets import QWebEngineView
          from PySide6.QtQml import QQmlApplicationEngine
          from PySide6.QtQuick import QQuickWindow
          from PySide6.QtQuickControls2 import QQuickStyle
          from core.database import Database
          from ui.bridge import Bridge
          from ui.quick_shell import launch_quick_preview

          print(PySide6.__version__, sqlite3.sqlite_version, QWebEngineView.__name__, QWebChannel.__name__, Database.__name__, Bridge.__name__, QQmlApplicationEngine.__name__, QQuickWindow.__name__, QQuickStyle.__name__, launch_quick_preview.__name__)
          PY
